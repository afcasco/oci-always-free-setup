homelab_domain: afcasco.dev
server_hostname: gizmo
server_timezone: Etc/UTC
paperless_timezone: Europe/Madrid

base_packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - htop
  - jq
  - nano
  - rsync
  - wget
  - parted
  - e2fsprogs
  - acl

bootstrap_user: ubuntu
admin_user: afcasco
admin_user_shell: /bin/bash

admin_user_groups:
  - sudo
  - users

admin_ssh_public_key: "ssh-rsa  ssh-key-2026-07-11"

wireguard_interface: wg0
wireguard_port: 51820
wireguard_network: 10.66.66.0/24
wireguard_server_address: 10.66.66.1/24

wireguard_peers:
  - name: pr819
    public_key: "{{ vault_wireguard_pr819_public_key }}"
    address: 10.66.66.2/32

data_mount_path: /mnt/data
data_filesystem_type: ext4
data_filesystem_label: data-new
data_mount_options: defaults,nofail

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_users:
  - afcasco

managed_stacks:
  - caddy
  - portainer
  - uptime-kuma
  - monitoring
  - authentik
  - n8n
  - stirling-pdf
  - paperless

enabled_stacks:
  - caddy
  - portainer
  - uptime-kuma
  - monitoring
  - authentik
  - n8n
  - stirling-pdf
  - paperless

caddy_bind_ip: 10.0.0.137

grafana_admin_user: "{{ vault_grafana_admin_user }}"
grafana_admin_password: "{{ vault_grafana_admin_password }}"
grafana_url: "https://grafana.{{ homelab_domain }}"
authentik_url: "https://auth.{{ homelab_domain }}"
grafana_oidc_client_secret: "{{ vault_grafana_oidc_client_secret }}"
grafana_oidc_client_id: grafana

portainer_admin_user: afcasco
portainer_admin_password: "{{ vault_portainer_admin_password }}"
portainer_url: "https://portainer.{{ homelab_domain }}"
portainer_oidc_client_id: portainer
portainer_oidc_client_secret: "{{ vault_portainer_oidc_client_secret }}"

authentik_primary_user: afcasco
authentik_primary_user_name: "Alex"
authentik_primary_user_email: "afcasco@gmail.com"
authentik_primary_user_password: "{{ vault_authentik_primary_user_password }}"
authentik_pg_db: authentik
authentik_pg_user: authentik
authentik_pg_pass: "{{ vault_authentik_pg_pass }}"
authentik_secret_key: "{{ vault_authentik_secret_key }}"

n8n_url: "https://n8n.{{ homelab_domain }}"
n8n_encryption_key: "{{ vault_n8n_encryption_key }}"

stirling_pdf_url: "https://pdf.{{ homelab_domain }}"
stirling_admin_user: "{{ vault_stirling_admin_user }}"
stirling_admin_password: "{{ vault_stirling_admin_password }}"

stirling_oidc_client_id: stirling-pdf
stirling_oidc_client_secret: "{{ vault_stirling_oidc_client_secret }}"

paperless_db_password: "{{ vault_paperless_db_password }}"
paperless_secret_key: "{{ vault_paperless_secret_key }}"
paperless_admin_user: "{{ vault_paperless_admin_user }}"
paperless_admin_password: "{{ vault_paperless_admin_password }}"
paperless_url: "https://paperless.{{ homelab_domain }}"

persistent_directories:
  - path: /mnt/data/docker/caddy/data
    owner: 0
    group: 0
    mode: "0755"

  - path: /mnt/data/docker/caddy/config
    owner: 0
    group: 0
    mode: "0755"


- name: Determine disabled managed stacks
  ansible.builtin.set_fact:
    disabled_stacks: "{{ managed_stacks | difference(enabled_stacks) }}"

- name: Validate stack dependencies
  ansible.builtin.assert:
    that:
      - >
        'authentik' in enabled_stacks
        or (
          'portainer' not in enabled_stacks
          and 'monitoring' not in enabled_stacks
          and 'uptime-kuma' not in enabled_stacks
        )
    fail_msg: >-
      Authentik must be enabled while Portainer, monitoring, or Uptime Kuma
      SSO is enabled. Disable those dependent stacks first, or keep
      Authentik enabled.
  tags:
    - always

- name: Check disabled managed stack directories
  ansible.builtin.stat:
    path: "/opt/stacks/{{ item }}"
  loop: "{{ disabled_stacks }}"
  register: disabled_stack_dirs
  loop_control:
    label: "{{ item }}"

- name: Ensure disabled managed stacks are stopped
  community.docker.docker_compose_v2:
    project_src: "/opt/stacks/{{ item.item }}"
    state: absent
  loop: "{{ disabled_stack_dirs.results }}"
  when: item.stat.exists
  loop_control:
    label: "{{ item.item }}"

- name: Reconcile Caddy configuration
  ansible.builtin.import_tasks: caddy.yml
  tags:
    - caddy

- name: Reconcile Authentik configuration
  ansible.builtin.import_tasks: authentik.yml
  tags:
    - authentik

- name: Reconcile n8n configuration
  ansible.builtin.import_tasks: n8n.yml
  tags:
    - n8n

- name: Reconcile Stirling PDF configuration
  ansible.builtin.import_tasks: stirling-pdf.yml
  tags:
    - stirling-pdf

- name: Reconcile Paperless configuration
  ansible.builtin.import_tasks: paperless.yml
  tags:
    - paperless

- name: Reconcile Monitoring configuration
  ansible.builtin.import_tasks: monitoring.yml
  tags:
    - monitoring

- name: Reconcile Portainer configuration
  ansible.builtin.import_tasks: portainer.yml
  tags:
    - portainer

- name: Reconcile Uptime Kuma configuration
  ansible.builtin.import_tasks: uptime-kuma.yml
  tags:
    - uptime-kuma
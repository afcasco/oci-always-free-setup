- name: Ensure Portainer stack directory exists
  ansible.builtin.file:
    path: /opt/stacks/portainer
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  when: "'portainer' in enabled_stacks"

- name: Synchronize Portainer stack configuration
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../stacks/portainer/"
    dest: /opt/stacks/portainer/
    archive: true
    delete: true
    rsync_opts: "{{ stack_sync_rsync_opts }}"
  become: false
  when: "'portainer' in enabled_stacks"

- name: Ensure Portainer environment file is configured
  ansible.builtin.template:
    src: portainer.env.j2
    dest: /opt/stacks/portainer/.env
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  when: "'portainer' in enabled_stacks"

- name: Ensure Portainer stack is running
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/portainer
    state: present
  when: "'portainer' in enabled_stacks"

#
# Authentik blueprint
#

- name: Ensure Authentik blueprint directory access for Portainer
  ansible.builtin.import_tasks: authentik-blueprint-dir.yml
  when:
    - "'portainer' in enabled_stacks"
    - "'authentik' in enabled_stacks"

- name: Ensure Authentik blueprint staging directory exists for Portainer
  ansible.builtin.file:
    path: /opt/stacks/authentik/.blueprint-staging
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"
  when:
    - "'portainer' in enabled_stacks"
    - "'authentik' in enabled_stacks"

- name: Render Portainer Authentik blueprint to staging
  ansible.builtin.template:
    src: authentik-blueprint-portainer.yaml.j2
    dest: /opt/stacks/authentik/.blueprint-staging/portainer.yaml
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0640"
  no_log: true
  when:
    - "'portainer' in enabled_stacks"
    - "'authentik' in enabled_stacks"

- name: Allow Authentik worker to read staged Portainer blueprint
  ansible.posix.acl:
    path: /opt/stacks/authentik/.blueprint-staging/portainer.yaml
    entity: "1000"
    etype: user
    permissions: "r"
    state: present
  when:
    - "'portainer' in enabled_stacks"
    - "'authentik' in enabled_stacks"

- name: Deny group access to staged Portainer blueprint
  ansible.posix.acl:
    path: /opt/stacks/authentik/.blueprint-staging/portainer.yaml
    etype: group
    permissions: "---"
    state: present
  when:
    - "'portainer' in enabled_stacks"
    - "'authentik' in enabled_stacks"

- name: Deny other access to staged Portainer blueprint
  ansible.posix.acl:
    path: /opt/stacks/authentik/.blueprint-staging/portainer.yaml
    etype: other
    permissions: "---"
    state: present
  when:
    - "'portainer' in enabled_stacks"
    - "'authentik' in enabled_stacks"

- name: Publish Portainer Authentik blueprint atomically
  ansible.builtin.shell: |
    set -euo pipefail

    src="/opt/stacks/authentik/.blueprint-staging/portainer.yaml"
    dst="/opt/stacks/authentik/blueprints/portainer.yaml"
    tmp="/opt/stacks/authentik/.blueprint-staging/portainer.publish.yaml"

    needs_publish=true

    if [ -f "$dst" ] && cmp -s "$src" "$dst"; then
      if [ "$(stat -c '%u:%g' "$src")" = "$(stat -c '%u:%g' "$dst")" ] && \
         [ "$(getfacl -cp "$src")" = "$(getfacl -cp "$dst")" ]; then
        needs_publish=false
      fi
    fi

    if [ "$needs_publish" = true ]; then
      cp --preserve=all "$src" "$tmp"
      mv -f "$tmp" "$dst"
      echo changed
    fi
  args:
    executable: /bin/bash
  register: authentik_portainer_blueprint_publish
  changed_when: "'changed' in authentik_portainer_blueprint_publish.stdout"
  no_log: true
  when:
    - "'portainer' in enabled_stacks"
    - "'authentik' in enabled_stacks"

#
# Portainer initialization / OAuth configuration
#

- name: Wait for Portainer API
  ansible.builtin.uri:
    url: "{{ portainer_url }}/api/status"
    method: GET
    status_code: 200
    validate_certs: true
  register: portainer_ready
  retries: 20
  delay: 3
  until: portainer_ready.status == 200
  when:
    - "'portainer' in enabled_stacks"
    - not ansible_check_mode

- name: Initialize Portainer admin on fresh installation
  ansible.builtin.uri:
    url: "{{ portainer_url }}/api/users/admin/init"
    method: POST
    body_format: json
    body:
      Username: "{{ portainer_admin_user }}"
      Password: "{{ portainer_admin_password }}"
    status_code:
      - 200
      - 409
    validate_certs: true
  no_log: true
  when:
    - "'portainer' in enabled_stacks"
    - not ansible_check_mode

- name: Authenticate to Portainer API
  ansible.builtin.uri:
    url: "{{ portainer_url }}/api/auth"
    method: POST
    body_format: json
    body:
      Username: "{{ portainer_admin_user }}"
      Password: "{{ portainer_admin_password }}"
    return_content: true
    status_code: 200
    validate_certs: true
  register: portainer_auth
  no_log: true
  when:
    - "'portainer' in enabled_stacks"
    - not ansible_check_mode

- name: Configure Portainer OAuth with Authentik
  ansible.builtin.uri:
    url: "{{ portainer_url }}/api/settings"
    method: PUT
    headers:
      Authorization: "Bearer {{ portainer_auth.json.jwt }}"
    body_format: json
    body:
      AuthenticationMethod: 3
      OAuthSettings:
        ClientID: "{{ portainer_oidc_client_id }}"
        ClientSecret: "{{ portainer_oidc_client_secret }}"
        AuthorizationURI: "{{ authentik_url }}/application/o/authorize/"
        AccessTokenURI: "{{ authentik_url }}/application/o/token/"
        ResourceURI: "{{ authentik_url }}/application/o/userinfo/"
        RedirectURI: "{{ portainer_url }}/"
        LogoutURI: "{{ authentik_url }}/application/o/portainer/end-session/"
        UserIdentifier: preferred_username
        Scopes: "openid email profile"
        OAuthAutoCreateUsers: true
        OAuthAutoMapTeamMemberships: false
        DefaultTeamID: 0
        HideInternalAuth: true
        SSO: true
        AuthStyle: 0
        TeamMemberships:
          AdminAutoPopulate: false
          AdminGroupClaimsRegexList: []
          OAuthClaimMappings: []
          OAuthClaimName: ""
    status_code: 200
    validate_certs: true
  no_log: true
  when:
    - "'portainer' in enabled_stacks"
    - not ansible_check_mode
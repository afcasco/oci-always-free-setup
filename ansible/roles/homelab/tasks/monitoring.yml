- name: Ensure Monitoring stack directory exists
  ansible.builtin.file:
    path: /opt/stacks/monitoring
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  when: "'monitoring' in enabled_stacks"

- name: Synchronize Monitoring stack configuration
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../stacks/monitoring/"
    dest: /opt/stacks/monitoring/
    archive: true
    delete: true
    rsync_opts: "{{ stack_sync_rsync_opts }}"
  become: false
  when: "'monitoring' in enabled_stacks"

- name: Ensure Monitoring environment file is configured
  ansible.builtin.template:
    src: monitoring.env.j2
    dest: /opt/stacks/monitoring/.env
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  when: "'monitoring' in enabled_stacks"

- name: Ensure Authentik blueprint directory exists for Monitoring
  ansible.builtin.file:
    path: /opt/stacks/authentik/blueprints
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  when:
    - "'monitoring' in enabled_stacks"
    - "'authentik' in enabled_stacks"

- name: Ensure Grafana Authentik blueprint is configured
  ansible.builtin.template:
    src: authentik-blueprint-grafana.yaml.j2
    dest: /opt/stacks/authentik/blueprints/grafana.yaml
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  no_log: true
  when:
    - "'monitoring' in enabled_stacks"
    - "'authentik' in enabled_stacks"

- name: Ensure Monitoring stack is running
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/monitoring
    state: present
  when: "'monitoring' in enabled_stacks"
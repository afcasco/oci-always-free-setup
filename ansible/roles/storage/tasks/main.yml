- name: Determine root filesystem device
  ansible.builtin.command:
    cmd: findmnt -n -o SOURCE /
  register: root_device
  changed_when: false
  check_mode: false

- name: Determine root physical disk
  ansible.builtin.command:
    cmd: "lsblk -n -o PKNAME {{ root_device.stdout }}"
  register: root_disk_name
  changed_when: false
  check_mode: false

- name: Wait for non-root data disk to appear
  ansible.builtin.shell: |
    set -euo pipefail

    root_disk="/dev/{{ root_disk_name.stdout | trim }}"

    lsblk -dn -o PATH,TYPE \
      | awk -v root="$root_disk" '$2 == "disk" && $1 != root { print $1 }'
  args:
    executable: /bin/bash
  register: data_disk_wait
  changed_when: false
  check_mode: false
  retries: 30
  delay: 2
  until: data_disk_wait.stdout_lines | length > 0

- name: Ensure exactly one non-root disk exists
  ansible.builtin.assert:
    that:
      - data_disk_wait.stdout_lines | length == 1
    fail_msg: >-
      Expected exactly one non-root disk, found:
      {{ data_disk_wait.stdout_lines }}

- name: Set detected data disk
  ansible.builtin.set_fact:
    data_disk: "{{ data_disk_wait.stdout_lines[0] }}"

- name: Check whether data disk has partitions
  ansible.builtin.command:
    cmd: "lsblk -n -o TYPE {{ data_disk }}"
  register: data_disk_types
  changed_when: false
  check_mode: false

- name: Inspect data disk signatures
  ansible.builtin.command:
    cmd: "wipefs --noheadings --output TYPE {{ data_disk }}"
  register: data_disk_signatures
  changed_when: false
  check_mode: false

- name: Determine data disk state
  ansible.builtin.set_fact:
    data_disk_has_partitions: "{{ 'part' in data_disk_types.stdout_lines }}"
    data_disk_has_signatures: "{{ data_disk_signatures.stdout | trim | length > 0 }}"

- name: Refuse to initialize unpartitioned disk containing existing data
  ansible.builtin.assert:
    that:
      - data_disk_has_partitions or not data_disk_has_signatures
    fail_msg: >-
      {{ data_disk }} has no partitions but contains an existing filesystem
      or disk signature. Refusing to create a partition table because doing
      so could destroy existing data.

- name: Refuse to initialize blank data disk without explicit approval
  ansible.builtin.assert:
    that:
      - data_disk_initialize | bool
    fail_msg: >-
      {{ data_disk }} appears to be blank. Set data_disk_initialize=true
      explicitly to allow Ansible to partition and format it.
  when:
    - not data_disk_has_partitions
    - not data_disk_has_signatures

- name: Determine whether data disk should be initialized
  ansible.builtin.set_fact:
    data_disk_should_initialize: >-
      {{
        not data_disk_has_partitions
        and not data_disk_has_signatures
        and data_disk_initialize | bool
      }}

- name: Create GPT partition table on explicitly approved blank data disk
  community.general.parted:
    device: "{{ data_disk }}"
    label: gpt
    number: 1
    state: present
    part_start: "0%"
    part_end: "100%"
  when: data_disk_should_initialize

- name: Set data partition device
  ansible.builtin.set_fact:
    data_partition: >-
      {{
        data_disk ~
        ('p1' if data_disk is match('.*[0-9]$') else '1')
      }}

- name: Create filesystem on new data partition
  community.general.filesystem:
    fstype: "{{ data_filesystem_type }}"
    dev: "{{ data_partition }}"
    opts: "-L {{ data_filesystem_label }}"
  when: data_disk_should_initialize

- name: Inspect detected data disk
  ansible.builtin.command:
    cmd: "lsblk -n -o NAME,TYPE,FSTYPE,MOUNTPOINTS {{ data_disk }}"
  register: data_disk_info
  changed_when: false
  check_mode: false

- name: Show detected data disk
  ansible.builtin.debug:
    msg:
      - "Root disk: /dev/{{ root_disk_name.stdout | trim }}"
      - "Data disk: {{ data_disk }}"
      - "{{ data_disk_info.stdout_lines }}"

- name: Find filesystem by label
  ansible.builtin.command:
    cmd: "blkid -L {{ data_filesystem_label }}"
  register: data_device
  changed_when: false
  check_mode: false

- name: Fail if data filesystem cannot be found
  ansible.builtin.assert:
    that:
      - data_device.stdout | length > 0
    fail_msg: "Could not find filesystem labelled {{ data_filesystem_label }}"

- name: Read filesystem UUID
  ansible.builtin.command:
    cmd: "blkid -s UUID -o value {{ data_device.stdout }}"
  register: data_uuid
  changed_when: false
  check_mode: false

- name: Ensure data mount directory exists
  ansible.builtin.file:
    path: "{{ data_mount_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure data volume is mounted persistently by UUID
  ansible.posix.mount:
    path: "{{ data_mount_path }}"
    src: "UUID={{ data_uuid.stdout }}"
    fstype: "{{ data_filesystem_type }}"
    opts: "{{ data_mount_options }}"
    dump: "0"
    passno: "2"
    state: mounted

- name: Ensure persistent application directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ persistent_directories }}"
  loop_control:
    label: "{{ item.path }}"

- name: Ensure Monitoring stack directory exists
  ansible.builtin.file:
    path: /opt/stacks/monitoring
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  when: "'monitoring' in enabled_stacks"

- name: Synchronize Monitoring stack configuration
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../stacks/monitoring/"
    dest: /opt/stacks/monitoring/
    archive: true
    delete: true
    rsync_opts: "{{ stack_sync_rsync_opts }}"
  become: false
  when: "'monitoring' in enabled_stacks"

- name: Ensure Monitoring environment file is configured
  ansible.builtin.template:
    src: monitoring.env.j2
    dest: /opt/stacks/monitoring/.env
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  no_log: true
  when: "'monitoring' in enabled_stacks"

#
# Grafana Authentik blueprint
#

- name: Ensure Authentik blueprint directory access for Monitoring
  ansible.builtin.import_tasks: authentik-blueprint-dir.yml
  when:
    - "'monitoring' in enabled_stacks"
    - "'authentik' in enabled_stacks"

- name: Ensure Authentik blueprint staging directory exists for Monitoring
  ansible.builtin.file:
    path: /opt/stacks/authentik/.blueprint-staging
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"
  when:
    - "'monitoring' in enabled_stacks"
    - "'authentik' in enabled_stacks"

- name: Render Grafana Authentik blueprint to staging
  ansible.builtin.template:
    src: authentik-blueprint-grafana.yaml.j2
    dest: /opt/stacks/authentik/.blueprint-staging/grafana.yaml
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0640"
  no_log: true
  when:
    - "'monitoring' in enabled_stacks"
    - "'authentik' in enabled_stacks"

- name: Allow Authentik worker to read staged Grafana blueprint
  ansible.posix.acl:
    path: /opt/stacks/authentik/.blueprint-staging/grafana.yaml
    entity: "1000"
    etype: user
    permissions: "r"
    state: present
  when:
    - "'monitoring' in enabled_stacks"
    - "'authentik' in enabled_stacks"

- name: Deny group access to staged Grafana blueprint
  ansible.posix.acl:
    path: /opt/stacks/authentik/.blueprint-staging/grafana.yaml
    etype: group
    permissions: "---"
    state: present
  when:
    - "'monitoring' in enabled_stacks"
    - "'authentik' in enabled_stacks"

- name: Deny other access to staged Grafana blueprint
  ansible.posix.acl:
    path: /opt/stacks/authentik/.blueprint-staging/grafana.yaml
    etype: other
    permissions: "---"
    state: present
  when:
    - "'monitoring' in enabled_stacks"
    - "'authentik' in enabled_stacks"

- name: Publish Grafana Authentik blueprint atomically
  ansible.builtin.shell: |
    set -euo pipefail

    src="/opt/stacks/authentik/.blueprint-staging/grafana.yaml"
    dst="/opt/stacks/authentik/blueprints/grafana.yaml"
    tmp="/opt/stacks/authentik/.blueprint-staging/grafana.publish.yaml"

    needs_publish=true

    if [ -f "$dst" ] && cmp -s "$src" "$dst"; then
      if [ "$(stat -c '%u:%g' "$src")" = "$(stat -c '%u:%g' "$dst")" ] && \
         [ "$(getfacl -cp "$src")" = "$(getfacl -cp "$dst")" ]; then
        needs_publish=false
      fi
    fi

    if [ "$needs_publish" = true ]; then
      cp --preserve=all "$src" "$tmp"
      mv -f "$tmp" "$dst"
      echo changed
    fi
  args:
    executable: /bin/bash
  register: authentik_grafana_blueprint_publish
  changed_when: "'changed' in authentik_grafana_blueprint_publish.stdout"
  no_log: true
  when:
    - "'monitoring' in enabled_stacks"
    - "'authentik' in enabled_stacks"

#
# Monitoring stack
#

- name: Ensure Monitoring stack is running
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/monitoring
    state: present
  when: "'monitoring' in enabled_stacks"
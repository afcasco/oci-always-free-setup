- name: Ensure admin group exists
  ansible.builtin.group:
    name: "{{ admin_user }}"
    gid: "{{ admin_user_gid }}"
    state: present

- name: Ensure admin user exists
  ansible.builtin.user:
    name: "{{ admin_user }}"
    uid: "{{ admin_user_uid }}"
    group: "{{ admin_user }}"
    groups: "{{ admin_user_groups }}"
    append: true
    shell: "{{ admin_user_shell }}"
    create_home: true
    state: present

- name: Ensure SSH directory exists
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.ssh"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"

- name: Ensure authorized SSH key is installed
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_ssh_public_key }}"
    state: present